[build-system]
requires = [
    "setuptools>=65.0,<82.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyannote.audio"
version = "3.3.2"
description = "Neural building blocks for speaker diarization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Hervé Bredin", email = "herve.bredin@irit.fr" }
]
license = { text = "MIT" }
keywords = ["audio", "diarization", "speaker recognition", "machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "asteroid-filterbanks >=0.4",
    "einops >=0.6.0",
    "huggingface_hub >= 0.13.0",
    "lightning >= 2.0.1",
    "omegaconf >=2.1,<3.0",
    "pyannote.core >= 5.0.0",
    "pyannote.database >= 5.0.1",
    "pyannote.metrics >= 3.2",
    "pyannote.pipeline >= 3.0.1",
    "pytorch_metric_learning >= 2.1.0",
    "rich >= 12.0.0",
    "safetensors >= 0.4.5",
    "semver >= 3.0.0",
    "soundfile >= 0.12.1",
    "speechbrain >= 1.0.0",
    "tensorboardX >= 2.6",
    "torch >= 2.0.0",
    "torch_audiomentations >= 0.11.0",
    "torchaudio >= 2.2.0",
    "torchmetrics >= 0.11.0"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
